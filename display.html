<!DOCTYPE html>
<html>
<head>
  <title>Quality Message Wall</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;

      background: linear-gradient(-45deg,
      #001f3f,
      #003366,
      #004080,
      #00264d);

      background-size: 400% 400%;

      animation: gradientMove 10s ease infinite;
    }

    @keyframes gradientMove {

      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .title {

      position: absolute;

      top: 15px;
      left: 25px;

      font-size: 24px;
      font-weight: bold;

      z-index: 1000;

      opacity: 0.9;

      text-shadow: 0 0 8px rgba(255,255,255,0.3);
    }

    #container {

      position: relative;

      width: 100vw;
      height: calc(100vh - 60px);

      margin-top: 60px;

      overflow: hidden;
    }

    .msg {

      position: absolute;

      max-width: 180px;

      padding: 6px 8px;

      border-radius: 10px;

      background: rgba(0,0,0,0.15);

      backdrop-filter: blur(3px);

      word-break: break-word;

      line-height: 1.35;

      box-shadow: 0 0 8px rgba(0,0,0,0.12);

      opacity: 0.95;
    }

    .new {

      animation: pop 0.5s ease;
    }

    @keyframes pop {

      0% {
        transform: scale(0.4);
        opacity: 0;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .name {

      text-align: right;

      font-size: 0.45rem;

      opacity: 0.7;

      margin-top: 3px;
    }

  </style>
</head>

<body>

<div class="title">
  💙 Love our consumer | Quality First - 최고의 문구를 선정하여 소정의 상품을 드립니다.
</div>

<div id="container"></div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getFirestore,
  collection,
  onSnapshot,
  query,
  orderBy,
  limit
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyA5jr2U1r5FafSC6493ePuv-g6qtZ_iqyw",

  authDomain: "quality-campaign.firebaseapp.com",

  projectId: "quality-campaign",

  storageBucket: "quality-campaign.firebasestorage.app",

  messagingSenderId: "247809746725",

  appId: "1:247809746725:web:7f8e0950a475793afe1ccc",

  measurementId: "G-X9D2FWTB1T"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const container = document.getElementById("container");

let existingMessages = new Set();

let positions = [];

function randomColor() {

  const colors = [

    "#00d4ff",
    "#66ffcc",
    "#ffffff",
    "#99ccff",
    "#b8fff9"

  ];

  return colors[
    Math.floor(Math.random() * colors.length)
  ];
}

function autoFontSize(len) {

  if (len > 120) return "0.55rem";

  if (len > 80) return "0.65rem";

  if (len > 50) return "0.75rem";

  if (len > 30) return "0.9rem";

  return "1rem";
}

function isOverlapping(x, y) {

  return positions.some(p =>

    Math.abs(p.x - x) < 7 &&
    Math.abs(p.y - y) < 6

  );
}

function getSafePosition() {

  let pos;

  let tries = 0;

  do {

    pos = {

      x: Math.random() * 92,

      y: Math.random() * 92
    };

    tries++;

  } while (

    isOverlapping(pos.x, pos.y)

    && tries < 40
  );

  positions.push(pos);

  return pos;
}

function startFloating(div) {

  let x = parseFloat(div.style.left);

  let y = parseFloat(div.style.top);

  // 🔥 아주 천천히 이동
  let dx = (Math.random() - 0.5) * 0.005;

  let dy = (Math.random() - 0.5) * 0.005;

  function move() {

    x += dx;

    y += dy;

    // 벽 반사
    if (x < 0 || x > 95) dx *= -1;

    if (y < 0 || y > 95) dy *= -1;

    div.style.left = x + "%";

    div.style.top = y + "%";

    requestAnimationFrame(move);
  }

  requestAnimationFrame(move);
}

function createMessage(id, text, name) {

  const div = document.createElement("div");

  div.className = "msg new";

  const content = document.createElement("div");

  content.innerText = text;

  const nameDiv = document.createElement("div");

  nameDiv.className = "name";

  nameDiv.innerText = name
    ? `- ${name} -`
    : "";

  div.appendChild(content);

  div.appendChild(nameDiv);

  div.style.fontSize =
    autoFontSize(text.length);

  div.style.color =
    randomColor();

  const pos = getSafePosition();

  div.style.left = pos.x + "%";

  div.style.top = pos.y + "%";

  container.appendChild(div);

  // 🔥 떠다니기 시작
  startFloating(div);

  existingMessages.add(id);
}

const q = query(

  collection(db, "messages"),

  orderBy("time", "desc"),

  limit(150)

);

onSnapshot(q, (snapshot) => {

  snapshot.forEach(doc => {

    const id = doc.id;

    if (!existingMessages.has(id)) {

      const data = doc.data();

      createMessage(

        id,

        data.text,

        data.name
      );
    }
  });
});

</script>

</body>
</html>
